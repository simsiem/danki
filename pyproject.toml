[build-system]
requires = ["hatchling", "versioningit"]
build-backend = "hatchling.build"

[project]
name = "danki"
dynamic = ["version"]
description = 'Anki addons to learn for school with dedicated exercises before vocabulary exams.'
readme = "README.rst"
requires-python = ">=3.12"
license = "GPL-3.0-or-later"
keywords = []
authors = [
  { name = "Simon Siemens", email = "simon.siemens@arcor.de" },
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: Implementation :: CPython",
  "Programming Language :: Python :: Implementation :: PyPy",
]
dependencies = [
  "cyclopts",
  "rich",
]

[project.scripts]
danki = "danki.cli:app"

[tool.hatch.build]
exclude = [
  "/src/danki/__about__.py",
]

[tool.hatch.build.hooks.versioningit-onbuild]
source-file = "src/danki/__about__.py"
build-file = "danki/__about__.py"

[tool.hatch.version]
source = "versioningit"

[tool.hatch.envs.dev]
extra-dependencies = [
  "anki==26.9.3",
  "pyrefly",
  "pytest<9",
  "pytest-bdd",
]

[tool.hatch.envs.hatch-check-types]
extra-dependencies = [
  "anki==26.9.3",
  "pytest-bdd",
]

[tool.hatch.envs.hatch-test]
dependencies = [
  "anki==26.9.3",
  "pytest<9",
  "pytest-bdd",
]

[tool.hatch.envs.ankiint]
dependencies = [
  "anki==26.9.3",
  "aqt[qt69]==26.9.3",
  "pytest<9",
  "pytest-anki2==2.2.0",
  "pytest-bdd",
]

[tool.hatch.envs.ankiint.scripts]
test = "QT_QPA_PLATFORM=offscreen pytest tests_ankiint {args}"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source_pkgs = ["danki", "tests"]
branch = true
parallel = true
omit = [
  "src/danki/__about__.py",
]

[tool.coverage.paths]
danki = ["src/danki", "*/danki/src/danki"]
tests = ["tests", "*/danki/tests"]

[tool.coverage.report]
exclude_lines = [
  "no cov",
  "if __name__ == .__main__.:",
  "if TYPE_CHECKING:",
]

[tool.ruff]
line-length = 110

[tool.ruff.lint.extend-per-file-ignores]
"tests_ankiint/**" = ["S101", "PLR2004"]

[tool.pyrefly]
preset = "strict"
# Default search path: pyrefly infers `src`.
# In addition, use "." so tests can reference the scripts directory
search-path = ["src", "."]

[[tool.pyrefly.sub-config]]
matches = "tests*/**"

[tool.pyrefly.sub-config.errors]
implicit-any = false
